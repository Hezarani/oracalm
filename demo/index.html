<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OraCalm — dental-anxiety screening (demo)</title>
<meta name="description" content="Open, multilingual scoring for validated dental-anxiety instruments: MDAS, Corah DAS, MCDASf." />
<style>
  :root{
    --bg-1:#eef5f7; --bg-2:#e7f0f2; --card:#ffffff; --ink:#12303a; --muted:#5c7883;
    --line:#dbe7ec; --brand:#2c8c9c; --brand-d:#1c6472;
    --green:#2e9e6b; --amber:#cf8f22; --red:#d5544e;
    --shadow-sm:0 1px 2px rgba(18,48,58,.05);
    --shadow-lg:0 2px 6px rgba(18,48,58,.05),0 18px 40px rgba(18,48,58,.10);
    /* critically-damped "settle" easing — calm, no overshoot (apple-design §4) */
    --ease-settle:cubic-bezier(.22,.61,.36,1);
    --press:transform 110ms var(--ease-settle), background 140ms ease, border-color 140ms ease, color 140ms ease;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;color:var(--ink);
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2)) fixed;
    font:100%/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  .wrap{max-width:760px;margin:0 auto;padding:30px 18px 120px;animation:appear .5s var(--ease-settle) both}
  @keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  header h1{margin:0;font-size:clamp(28px,6vw,34px);font-weight:700;letter-spacing:-.6px;line-height:1.04}
  header .sub{color:var(--muted);margin:6px 0 0;font-size:15.5px;max-width:52ch}
  .badge{display:inline-flex;align-items:center;gap:7px;margin-top:14px;background:rgba(255,255,255,.7);
    color:var(--brand-d);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;
    backdrop-filter:blur(8px)}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--brand)}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow-sm);padding:18px;margin-top:18px}

  .seg{display:flex;flex-wrap:wrap;gap:8px}
  .seg button{flex:1;min-width:130px;border:1px solid var(--line);background:#fff;color:var(--ink);
    border-radius:12px;padding:11px 12px;font-size:14px;font-weight:600;cursor:pointer;transition:var(--press);text-align:center}
  .seg button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px;margin-top:2px;transition:color 140ms ease}
  .seg button:hover{border-color:#bcd3da}
  .seg button:active{transform:scale(.97)}
  .seg button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 6px 16px rgba(44,140,156,.28)}
  .seg button[aria-pressed="true"] small{color:#e9f5f7}

  .langrow{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 13px;cursor:pointer;font-weight:600;color:var(--ink);transition:var(--press)}
  .chip:active{transform:scale(.96)}
  .chip[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff}
  .prompt{color:var(--muted);font-size:14.5px;margin:12px 0 0}

  .item{padding:15px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .qhead{display:flex;gap:11px;align-items:flex-start}
  .qnum{flex:none;width:25px;height:25px;border-radius:50%;background:#e9f3f5;color:var(--brand-d);
    font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
  .qtext{font-size:15px;letter-spacing:-.1px}
  .opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;margin-inline-start:36px}
  .opts.stack{flex-direction:column}
  .opt{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-size:13.5px;
    cursor:pointer;transition:var(--press);text-align:start;color:var(--ink);position:relative}
  .opt .n{font-weight:700;margin-inline-end:7px;color:var(--muted);transition:color 140ms ease}
  .opts:not(.stack) .opt{min-width:46px;text-align:center}
  .opt:hover{border-color:#bcd3da}
  .opt:active{transform:scale(.96)}
  .opt[aria-pressed="true"]{border-color:var(--brand);background:var(--brand);color:#fff;box-shadow:0 5px 14px rgba(44,140,156,.26)}
  .opt[aria-pressed="true"] .n{color:#e9f5f7}

  /* Result — translucent floating material, content scrolls beneath (apple-design §12) */
  .result{position:sticky;bottom:16px;margin-top:20px;
    background:rgba(255,255,255,.72);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
    border:1px solid rgba(255,255,255,.6);box-shadow:var(--shadow-lg)}
  .result::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:18px 18px 0 0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent)}
  .rrow{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
  .rtop{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .score{font-size:clamp(38px,9vw,46px);font-weight:800;line-height:1;letter-spacing:-1.5px;font-variant-numeric:tabular-nums}
  .score small{font-size:16px;color:var(--muted);font-weight:600;letter-spacing:0}
  .scoreVal{display:inline-block;animation:settle .42s var(--ease-settle) both}
  @keyframes settle{from{opacity:.35;transform:scale(.94)}to{opacity:1;transform:none}}
  .band{font-weight:700;font-size:16px;letter-spacing:-.2px;transition:color 200ms ease}
  .desc{color:var(--muted);font-size:13.5px}
  .meter{height:10px;border-radius:999px;background:#e7eef1;overflow:hidden;margin:14px 0 4px}
  .meter > i{display:block;height:100%;border-radius:999px;will-change:width;
    transition:width .55s var(--ease-settle),background-color .35s ease}
  .flags{margin:12px 0 0;padding:0;list-style:none}
  .flags li{font-size:13px;font-weight:600;color:var(--red);background:rgba(213,84,78,.09);border:1px solid rgba(213,84,78,.24);
    border-radius:10px;padding:7px 11px;margin-top:7px;animation:settle .4s var(--ease-settle) both}
  .cite{margin-top:13px;font-size:12.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:11px}
  .cite a{color:var(--brand-d);text-decoration:none;border-bottom:1px solid rgba(28,100,114,.3)}
  .btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 15px;font-weight:600;
    cursor:pointer;font-size:13.5px;color:var(--ink);transition:var(--press)}
  .btn:hover{border-color:#bcd3da}
  .btn:active{transform:scale(.96)}

  .disc{font-size:12px;color:var(--muted);margin-top:20px;text-align:center;line-height:1.6;max-width:60ch;margin-inline:auto}
  footer{margin-top:20px;text-align:center;font-size:12.5px;color:var(--muted)}
  footer a{color:var(--brand-d);text-decoration:none}
  @media (max-width:520px){ .opts{margin-inline-start:0} .qnum{width:22px;height:22px} }

  /* Accessibility signals (apple-design §14) */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;transition-duration:.001ms!important}
    .meter>i{transition:none}
  }
  @media (prefers-reduced-transparency:reduce){
    .result{background:#fff;backdrop-filter:none;-webkit-backdrop-filter:none}
    .badge{background:#fff;backdrop-filter:none}
  }
  @media (prefers-contrast:more){
    :root{--line:#9db4bc;--muted:#3f5860}
    .opt,.seg button,.chip,.btn{border-width:1.5px}
  }
</style>
</head>
<body>
<div id="root" class="wrap"></div>

<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="text/babel">
const { useState } = React;

const SCALE_MDAS = {
  en:["Not anxious","Slightly anxious","Fairly anxious","Very anxious","Extremely anxious"],
  tr:["Kaygılı değilim","Biraz kaygılıyım","Oldukça kaygılıyım","Çok kaygılıyım","Aşırı derecede kaygılıyım"],
  fa:["نگران نیستم","کمی نگرانم","نسبتاً نگرانم","خیلی نگرانم","بی‌نهایت نگرانم"]
};
const SCALE_MCDASF = {en:["Relaxed / not worried","Very slightly worried","Fairly worried","Worried a lot","Very worried"]};
const CORAH_RELAXED = ["Relaxed","A little uneasy","Tense","Anxious","So anxious that I sometimes break out in a sweat or almost feel physically sick"];

const INSTRUMENTS = {
  mdas:{
    id:"mdas", name:"MDAS", full:"Modified Dental Anxiety Scale", pop:"Adults", langs:["en","tr","fa"],
    range:[5,25], sharedScale:SCALE_MDAS,
    prompt:{en:"Please indicate how anxious you would feel in each situation.",
            tr:"Lütfen her durumda ne kadar kaygılı hissedeceğinizi belirtin.",
            fa:"لطفاً مشخص کنید در هر موقعیت چقدر احساس نگرانی می‌کنید."},
    items:[
      {en:"If you went to your dentist for treatment tomorrow, how would you feel?",
       tr:"Yarın diş tedavisi için diş hekiminize gitseniz, kendinizi nasıl hissederdiniz?",
       fa:"اگر فردا برای درمان به دندان‌پزشک مراجعه کنید، چه احساسی خواهید داشت؟"},
      {en:"If you were sitting in the waiting room (waiting for treatment), how would you feel?",
       tr:"Bekleme odasında (tedavi için beklerken) otururken kendinizi nasıl hissederdiniz?",
       fa:"اگر در اتاق انتظار (در حال انتظار برای درمان) نشسته باشید، چه احساسی خواهید داشت؟"},
      {en:"If you were about to have a tooth drilled, how would you feel?",
       tr:"Dişiniz oyulmak (frezelenmek) üzereyken kendinizi nasıl hissederdiniz?",
       fa:"اگر قرار باشد دندانتان تراش داده شود، چه احساسی خواهید داشت؟"},
      {en:"If you were about to have your teeth scaled and polished, how would you feel?",
       tr:"Diş taşlarınız temizlenip cilalanmak üzereyken kendinizi nasıl hissederdiniz?",
       fa:"اگر قرار باشد دندان‌هایتان جرم‌گیری و پولیش شوند، چه احساسی خواهید داشت؟"},
      {en:"If you were about to have a local anaesthetic injection in your gum, above an upper back tooth, how would you feel?",
       tr:"Üst arka dişinizin üzerindeki diş etine lokal anestezi iğnesi yapılmak üzereyken kendinizi nasıl hissederdiniz?",
       fa:"اگر قرار باشد به لثه‌ی بالای دندان عقب فک بالا به شما آمپول بی‌حسی موضعی تزریق شود، چه احساسی خواهید داشت؟"}
    ],
    bands:[[5,9,"Low dental anxiety"],[10,18,"Moderate dental anxiety"],[19,25,"High dental anxiety (possible dental phobia)"]],
    cutoffs:[[19,"≥19 — high dental anxiety / possible dental phobia"]],
    cite:'Humphris GM, Morrison T, Lindsay SJE (1995). Community Dental Health, 12, 143–150.',
    doi:"https://pubmed.ncbi.nlm.nih.gov/7584581/", note:"Freely available with citation (official MDAS site, Univ. of St Andrews). TR/FA are convenience translations — verify before clinical use."
  },
  corah_das:{
    id:"corah_das", name:"Corah DAS", full:"Corah's Dental Anxiety Scale", pop:"Adults", langs:["en"],
    range:[4,20], prompt:{en:"Choose the answer that best describes how you would feel."},
    perItemOptions:[
      ["I would look forward to it as a reasonably enjoyable experience","I wouldn't care one way or the other","I would be a little uneasy about it","I would be afraid that it would be unpleasant and painful","I would be very frightened of what the dentist might do"],
      CORAH_RELAXED, CORAH_RELAXED, CORAH_RELAXED
    ],
    items:[
      {en:"If you had to go to the dentist tomorrow, how would you feel about it?"},
      {en:"When you are waiting in the dentist's office for your turn in the chair, how do you feel?"},
      {en:"When you are in the chair waiting while the dentist gets the drill ready, how do you feel?"},
      {en:"You are in the chair to have your teeth cleaned. While the dentist gets out the instruments to scrape your teeth, how do you feel?"}
    ],
    bands:[[4,8,"Low / minimal anxiety"],[9,12,"Moderate anxiety"],[13,14,"High anxiety"],[15,20,"Severe anxiety (possible dental phobia)"]],
    cutoffs:[[13,"≥13 — clinically significant anxiety (some references)"],[15,"≥15 — severe anxiety / possible dental phobia"]],
    cite:'Corah NL (1969). Development of a dental anxiety scale. J Dent Res, 48(4), 596.',
    doi:"https://doi.org/10.1177/00220345690480041801", note:"Classic 4-item scale; English wording only in this release."
  },
  mcdasf:{
    id:"mcdasf", name:"MCDASf", full:"Modified Child Dental Anxiety Scale (faces)", pop:"Children ~8–15y", langs:["en"],
    range:[8,40], sharedScale:SCALE_MCDASF,
    prompt:{en:"Show how you feel about each thing (1 = relaxed / not worried, 5 = very worried)."},
    items:[
      {en:"Going to the dentist"},{en:"Having your teeth looked at"},
      {en:"Having your teeth scraped and polished"},{en:"Having an injection in the gum"},
      {en:"Having a filling"},{en:"Having a tooth taken out"},
      {en:"Being put to sleep to have treatment"},
      {en:"Having a mixture of 'gas and air' that helps you feel comfortable but cannot put you to sleep"}
    ],
    bands:[[8,18,"Low anxiety"],[19,30,"Moderate anxiety"],[31,40,"High anxiety"]],
    cutoffs:[],
    cite:'Howard KE, Freeman R (2007). Int J Paediatr Dent, 17(4), 281–288.',
    doi:"https://doi.org/10.1111/j.1365-263X.2007.00830.x", note:"Higher totals = greater anxiety (normative mean ≈19.8). No single agreed cut-off; interpret with judgement."
  }
};

const BAND_COLORS = ["var(--green)","var(--amber)","var(--red)","var(--red)"];
const optionsFor = (inst,i,lang)=> inst.perItemOptions ? inst.perItemOptions[i] : (inst.sharedScale[lang]||inst.sharedScale.en);
const bandFor = (inst,total)=>{ const i=inst.bands.findIndex(b=>total>=b[0]&&total<=b[1]); return {index:i,label:i<0?"":inst.bands[i][2]}; };

function App(){
  const [iid,setIid]=useState("mdas");
  const [lang,setLang]=useState("en");
  const [ans,setAns]=useState({});
  const inst=INSTRUMENTS[iid];
  const effLang=inst.langs.includes(lang)?lang:"en";
  const rtl=effLang==="fa";

  const pick=id=>{setIid(id);setAns({});if(!INSTRUMENTS[id].langs.includes(lang))setLang("en");};
  const answered=inst.items.map((_,i)=>ans[i]).filter(v=>v!=null);
  const complete=answered.length===inst.items.length;
  const total=answered.reduce((s,v)=>s+v,0);
  const band=complete?bandFor(inst,total):null;
  const [lo,hi]=inst.range;
  const pct=complete?Math.round(((total-lo)/(hi-lo))*100):Math.round((answered.length/inst.items.length)*100);
  const flags=complete?inst.cutoffs.filter(c=>total>=c[0]):[];
  const bandColor=band?BAND_COLORS[band.index]:"var(--brand)";

  return (
    <div dir={rtl?"rtl":"ltr"}>
      <header>
        <h1>OraCalm</h1>
        <p className="sub">Open, multilingual scoring for validated dental-anxiety instruments.</p>
        <span className="badge">Educational / research aid — not a diagnostic device</span>
      </header>

      <div className="panel">
        <div className="seg" role="group" aria-label="Choose instrument">
          {Object.values(INSTRUMENTS).map(x=>(
            <button key={x.id} aria-pressed={iid===x.id} onClick={()=>pick(x.id)}>
              {x.name}<small>{x.pop}</small>
            </button>
          ))}
        </div>
        {inst.langs.length>1 && (
          <div className="langrow">
            <span>Language</span>
            {inst.langs.map(L=>(
              <button key={L} className="chip" aria-pressed={effLang===L} onClick={()=>setLang(L)}>{L.toUpperCase()}</button>
            ))}
          </div>
        )}
        <p className="prompt">{inst.prompt[effLang]||inst.prompt.en}</p>
      </div>

      <div className="panel">
        {inst.items.map((it,i)=>{
          const opts=optionsFor(inst,i,effLang);
          const longOpts=!!inst.perItemOptions;
          return (
            <div className="item" key={i}>
              <div className="qhead"><span className="qnum">{i+1}</span><span className="qtext">{it[effLang]||it.en}</span></div>
              <div className={"opts"+(longOpts?" stack":"")} role="group">
                {opts.map((label,idx)=>{
                  const val=idx+1;
                  return (
                    <button key={idx} className="opt" aria-pressed={ans[i]===val} onClick={()=>setAns(a=>({...a,[i]:val}))}>
                      <span className="n">{val}</span>{label}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>

      <div className="panel result">
        <div className="rrow">
          <div className="rtop">
            <div className="score"><span className="scoreVal" key={complete?total:"none"}>{complete?total:"—"}</span><small> / {hi}</small></div>
            <div>
              <div className="band" style={{color:complete?bandColor:"var(--muted)"}}>{complete?band.label:`Answer all ${inst.items.length} items`}</div>
              <div className="desc">{complete?`Range ${lo}–${hi}`:`${answered.length} of ${inst.items.length} answered`}</div>
            </div>
          </div>
          <button className="btn" onClick={()=>setAns({})}>Reset</button>
        </div>
        <div className="meter"><i style={{width:pct+"%",backgroundColor:bandColor}}></i></div>
        {flags.length>0 && <ul className="flags">{flags.map((c,k)=><li key={k}>⚑ {c[1]}</li>)}</ul>}
        <div className="cite">
          <div><strong>Source:</strong> {inst.cite} <a href={inst.doi} target="_blank" rel="noopener">reference ↗</a></div>
          <div style={{marginTop:6}}>{inst.note}</div>
        </div>
      </div>

      <p className="disc">OraCalm computes published scoring keys for screening and education only. It does not diagnose dental anxiety or phobia, does not store any answers, and does not replace clinical judgement or the original instruments' manuals.</p>
      <footer>Open-source (MIT) · <a href="https://github.com/Hezarani/oracalm" target="_blank" rel="noopener">github.com/Hezarani/oracalm</a></footer>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
